<polygon points="55,250 59,260 70,261 61,268 64,279 55,273 46,279 49,268 40,261 51,260"/>
<polygon points="315,285 319,295 330,296 321,303 324,314 315,308 306,314 309,303 300,296 311,295"/>
<polygon points="285,390 288,398 297,399 290,405 292,414 285,409 278,414 280,405 273,399 282,398"/>
</g>

<text x="187.5" y="485" text-anchor="middle"
font-family="Arial" font-size="28" font-weight="700" fill="white">Start Your Learning Journey</text>
<text x="187.5" y="520" text-anchor="middle"
font-family="Arial" font-size="15" fill="#F2F2FF">
Complete lessons, earn XP, unlock badges
</text>
<text x="187.5" y="540" text-anchor="middle"
font-family="Arial" font-size="15" fill="#F2F2FF">
and climb the leaderboard.
</text>

