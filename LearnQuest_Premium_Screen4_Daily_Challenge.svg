<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6C63FF"/>
    <stop offset="100%" stop-color="#4F46E5"/>
  </linearGradient>
  <filter id="shadow">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.18"/>
  </filter>
</defs>

<rect width="375" height="812" fill="#F7F8FC"/>

<!-- Header -->
<rect width="375" height="170" fill="url(#g)"/>
<text x="24" y="50" font-family="Arial" font-size="24" font-weight="700" fill="white">Daily Challenge</text>
<text x="24" y="78" font-family="Arial" font-size="14" fill="white">Complete today's missions and earn rewards!</text>

<!-- Streak Card -->
<rect x="20" y="105" width="335" height="85" rx="20" fill="white" opacity="0.18"/>
<text x="40" y="140" font-family="Arial" font-size="18" font-weight="700" fill="white">🔥 7 Day Streak</text>
<text x="40" y="165" font-family="Arial" font-size="14" fill="white">Keep it going for bonus XP!</text>

<!-- Challenge 1 -->
<rect x="20" y="210" width="335" height="90" rx="18" fill="white" filter="url(#shadow)"/>
<circle cx="50" cy="255" r="16" fill="#22C55E"/>
<text x="80" y="248" font-family="Arial" font-size="18" font-weight="700">Finish 1 Lesson</text>
<text x="80" y="270" font-family="Arial" font-size="14" fill="#666">Reward: +100 XP</text>
<rect x="240" y="242" width="85" height="32" rx="16" fill="#22C55E"/>
<text x="282.5" y="262" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Done</text>

<!-- Challenge 2 -->
<rect x="20" y="320" width="335" height="90" rx="18" fill="white" filter="url(#shadow)"/>
<circle cx="50" cy="365" r="16" fill="#FBBF24"/>
<text x="80" y="358" font-family="Arial" font-size="18" font-weight="700">Score 80% in Quiz</text>
<text x="80" y="380" font-family="Arial" font-size="14" fill="#666">Reward: +150 XP</text>
<rect x="240" y="352" width="85" height="32" rx="16" fill="#6C63FF"/>
<text x="282.5" y="372" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Start</text>

<!-- Challenge 3 -->
<rect x="20" y="430" width="335" height="90" rx="18" fill="white" filter="url(#shadow)"/>
<circle cx="50" cy="475" r="16" fill="#EF4444"/>
<text x="80" y="468" font-family="Arial" font-size="18" font-weight="700">Study 30 Minutes</text>
<text x="80" y="490" font-family="Arial" font-size="14" fill="#666">Reward: +80 XP</text>
<rect x="240" y="462" width="85" height="32" rx="16" fill="#6C63FF"/>
<text x="282.5" y="482" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Start</text>

<!-- Progress -->
<text x="20" y="560" font-family="Arial" font-size="20" font-weight="700">Today's Progress</text>
<rect x="20" y="580" width="335" height="12" rx="6" fill="#E5E7EB"/>
<rect x="20" y="580" width="223" height="12" rx="6" fill="#6C63FF"/>
<text x="300" y="598" font-family="Arial" font-size="13" fill="#666">67%</text>

<!-- Reward Card -->
<rect x="20" y="625" width="335" height="95" rx="20" fill="#FFF7E0" filter="url(#shadow)"/>
<text x="40" y="660" font-family="Arial" font-size="20" font-weight="700">🎁 Daily Reward</text>
<text x="40" y="685" font-family="Arial" font-size="14" fill="#666">Complete all challenges to unlock</text>
<text x="40" y="705" font-family="Arial" font-size="14" fill="#666">a Mystery Badge + 300 XP!</text>

<!-- Claim Button -->
<rect x="32" y="740" width="311" height="52" rx="26" fill="#6C63FF"/>
<text x="187.5" y="772" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="white">Claim Reward</text>

</svg>
