<!-- Avatar -->
<circle cx="187.5" cy="105" r="42" fill="#FFFFFF"/>
<circle cx="187.5" cy="98" r="16" fill="#6C63FF"/>
<path d="M162 132 C170 116 205 116 213 132" fill="#6C63FF"/>

<text x="187.5" y="165" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="white">Alex Johnson</text>
<text x="187.5" y="188" text-anchor="middle" font-family="Arial" font-size="14" fill="#E8E8FF">Level 12 • UI/UX Learner</text>

<!-- Stats -->
<rect x="20" y="230" width="335" height="95" rx="20" fill="white" filter="url(#shadow)"/>
<text x="60" y="265" font-family="Arial" font-size="14" fill="#666">XP</text>
<text x="60" y="290" font-family="Arial" font-size="22" font-weight="700">1250</text>

<text x="170" y="265" font-family="Arial" font-size="14" fill="#666">Coins</text>
<text x="170" y="290" font-family="Arial" font-size="22" font-weight="700">420</text>

