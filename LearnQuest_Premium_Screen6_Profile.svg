<rect x="20" y="498" width="190" height="10" rx="5" fill="#FBBF24"/>

<!-- Menu Cards -->
<rect x="20" y="540" width="335" height="60" rx="16" fill="white" filter="url(#shadow)"/>
<text x="40" y="575" font-family="Arial" font-size="17">⚙️ Settings</text>

<rect x="20" y="615" width="335" height="60" rx="16" fill="white" filter="url(#shadow)"/>
<text x="40" y="650" font-family="Arial" font-size="17">📊 Learning Statistics</text>

<rect x="20" y="690" width="335" height="60" rx="16" fill="white" filter="url(#shadow)"/>
