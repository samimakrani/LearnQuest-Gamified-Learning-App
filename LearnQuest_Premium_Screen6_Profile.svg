<text x="280" y="290" font-family="Arial" font-size="22" font-weight="700">12</text>

<!-- Learning Progress -->
<text x="20" y="360" font-family="Arial" font-size="20" font-weight="700">Learning Progress</text>

<text x="20" y="392" font-family="Arial" font-size="14">UI Design</text>
<rect x="20" y="402" width="335" height="10" rx="5" fill="#E5E7EB"/>
<rect x="20" y="402" width="280" height="10" rx="5" fill="#6C63FF"/>

<text x="20" y="440" font-family="Arial" font-size="14">Figma</text>
<rect x="20" y="450" width="335" height="10" rx="5" fill="#E5E7EB"/>
<rect x="20" y="450" width="240" height="10" rx="5" fill="#22C55E"/>

